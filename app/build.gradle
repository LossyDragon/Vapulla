plugins {
    id('com.android.application')
    // id 'com.google.devtools.ksp' version '1.8.10-1.0.9'
    id("org.jlleitschuh.gradle.ktlint") version "11.2.0"
    id('com.google.dagger.hilt.android')
    id('dagger.hilt.android.plugin')
    id('kotlin-kapt')
    id('kotlin-parcelize')
    id('org.jetbrains.kotlin.android')

}

android {
    compileSdkVersion 33

    defaultConfig {
        namespace 'in.dragonbra.vapulla'
        applicationId "in.dragonbra.vapulla"

        minSdkVersion 24
        targetSdkVersion 33

        versionCode 4
        versionName "0.3.0"

        multiDexEnabled true

        buildConfigField("String", "IMGUR_CLIENT_ID", "\"$vapullaImgurClientId\"")
        buildConfigField("String", "IMGUR_CLIENT_SECRET", "\"$vapullaImgurClientSecret\"")
        buildConfigField("String", "STEAM_API_KEY", "$steamApiKey")

        applicationVariants.all { variant ->
            variant.outputs.all { output ->
                outputFileName = "vapulla-${variant.versionName}.apk"
            }
        }

        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    configurations {
        debugImplementation.exclude group: "junit", module: "junit"
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.4.2"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    kapt {
        correctErrorTypes = true
    }
}

dependencies {
    // implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2023.01.00')
    implementation composeBom
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.animation:animation-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.ui:ui:1.4.0-beta01"
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation 'androidx.compose.material3:material3:1.1.0-alpha06'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"
    implementation "androidx.palette:palette:1.0.0"
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Accompanist
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.29.1-alpha"

    // Landscapist image loader
    implementation "com.github.skydoves:landscapist-coil:2.1.3"

    // Timber
    implementation "com.jakewharton.timber:timber:5.0.1"

    // RaamCosta Navigation
    // implementation 'io.github.raamcosta.compose-destinations:core:1.8.33-beta'
    // ksp 'io.github.raamcosta.compose-destinations:ksp:1.8.33-beta'

    // Android Support Libs
    implementation "androidx.annotation:annotation:1.5.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.databinding:databinding-runtime:7.4.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.paging:paging-runtime-ktx:3.1.1"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.android.material:material:1.8.0"

    // Preferences
    def androidx_preference = "1.2.0"
    implementation "androidx.preference:preference-ktx:$androidx_preference"

    // Room
    def room = "2.5.0"
    implementation "androidx.room:room-runtime:$room"
    kapt "androidx.room:room-compiler:$room"

    // Material Dialogs
    def material_dialogs = "3.3.0"
    implementation "com.afollestad.material-dialogs:bottomsheets:$material_dialogs"
    implementation "com.afollestad.material-dialogs:core:$material_dialogs"
    implementation "com.afollestad.material-dialogs:input:$material_dialogs"

    // Google Dagger/Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    kapt "androidx.hilt:hilt-compiler:1.0.0"
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'

    // Others
    implementation "com.brandongogetap:stickyheaders:0.6.2"
    implementation "com.github.penfeizhou.android.animation:apng:2.24.0"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation "com.hannesdorfmann.mosby3:mvp:3.1.1"
    implementation "com.mikhaellopez:circularimageview:4.3.0"
    implementation "com.squareup.okhttp3:okhttp:5.0.0-alpha.10"

    // Retrofit
    def retrofit = "2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit"
    implementation "com.squareup.retrofit2:retrofit:$retrofit"

    // Glide
    def glide = "4.14.2"
    implementation "com.github.bumptech.glide:glide:$glide"
    kapt "com.github.bumptech.glide:compiler:$glide"

    // Java-Steam
    implementation('in.dragonbra:javasteam:1.2.0')
    implementation "com.madgag.spongycastle:prov:1.58.0.0"
    api "com.google.protobuf:protobuf-java:3.22.0" // For protobuf builders
    api "org.apache.commons:commons-lang3:3.12.0"

    // Memory Leak testing
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'
}

// Run: gradlew ktlintCheck
// Run: gradlew ktlintFormat
ktlint {
    android = true
    outputToConsole = true
    // Ignore: lexicographic ordering, wildcard imports
    disabledRules = ["import-ordering", "no-wildcard-imports"]
}

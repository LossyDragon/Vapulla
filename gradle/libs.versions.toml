[versions]
activityCompose = "1.12.2" # https://mvnrepository.com/artifact/androidx.activity/activity-compose
agp = "8.13.2" # https://mvnrepository.com/artifact/com.android.application/com.android.application.gradle.plugin
apng = "3.0.5" # https://mvnrepository.com/artifact/com.github.penfeizhou.android.animation/apng
bouncycastle = "1.83" # https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
composeBom = "2025.12.01" # https://mvnrepository.com/artifact/androidx.compose/compose-bom
datastore = "1.2.0" # https://mvnrepository.com/artifact/androidx.datastore/datastore-preferences
javasteam = "1.8.0-SNAPSHOT" # https://mvnrepository.com/artifact/in.dragonbra/javasteam
koin = "4.1.1" # https://mvnrepository.com/artifact/io.insert-koin/koin-android
kotlin = "2.3.0" # https://mvnrepository.com/artifact/org.jetbrains.kotlin.android/org.jetbrains.kotlin.android.gradle.plugin
kotlinSerialization = "2.3.0" # https://mvnrepository.com/artifact/org.jetbrains.kotlin.plugin.serialization/org.jetbrains.kotlin.plugin.serialization.gradle.plugin
kotlinxSerializationCore = "1.9.0" # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-serialization-json-jvm
ksp = "2.3.4" # https://mvnrepository.com/artifact/com.google.devtools.ksp/symbol-processing-api?repo=central
landscapist = "2.6.2" # https://mvnrepository.com/artifact/com.github.skydoves/landscapist-coil
materialKolor = "4.0.5" # https://mvnrepository.com/artifact/com.materialkolor/material-kolor
nav3Core = "1.0.0" # https://mvnrepository.com/artifact/androidx.navigation3/navigation3-runtime
nav3Lifecycle = "2.10.0" # https://mvnrepository.com/artifact/androidx.lifecycle/lifecycle-viewmodel-navigation3
paging = "3.3.6" # https://mvnrepository.com/artifact/androidx.paging/paging-compose
protobuf = "4.33.2" # https://mvnrepository.com/artifact/com.google.protobuf/protobuf-java
qrose = "1.0.1" # https://mvnrepository.com/artifact/io.github.alexzhirkevich/qrose
room = "2.8.4" # https://mvnrepository.com/artifact/androidx.room/room-compiler
timber = "5.0.1" # https://mvnrepository.com/artifact/com.jakewharton.timber/timber

[libraries]
# Compose UI
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-alpha11" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# Navigation
nav3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
nav3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
nav3-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "nav3Lifecycle" }

# Dependency Injection
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

# Serialization & Data
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationCore" }

# Logging
android-timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# JavaSteam & Crypto
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
javasteam = { module = "in.dragonbra:javasteam", version.ref = "javasteam" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# Images & Media
apng = { module = "com.github.penfeizhou.android.animation:apng", version.ref = "apng" }
landscapist-coil = { module = "com.github.skydoves:landscapist-coil", version.ref = "landscapist" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

# Database & Storage
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

[bundles]
compose = [
    "androidx-activity-compose",
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-material-icons-core",
    "androidx-material-icons-extended",
    "material-kolor",
]

navigation = [
    "nav3-runtime",
    "nav3-ui",
    "nav3-viewmodel",
]

koin = [
    "koin-android",
    "koin-androidx-compose",
    "koin-core",
]

javasteam = [
    "bouncycastle",
    "javasteam",
    "protobuf-java",
]

images = [
    "apng",
    "landscapist-coil",
    "qrose",
]

database = [
    "datastore-preferences",
    "paging-compose",
    "room-paging",
    "room-runtime",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization" }
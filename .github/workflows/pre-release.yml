name: Pre-release

# Builds the signed release APK and puts it on the "prerelease" release, replacing the APK
# that was there. Runs when a push raises versionCode in app/build.gradle.kts, and by hand
# from the Actions tab (for one, to repeat a build that failed).
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64     the release keystore, base64-encoded. In PowerShell:
#                         [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")) | Set-Clipboard
#                       elsewhere: base64 -w0 release.jks
#   KEYSTORE_PASSWORD   password of the keystore
#   KEY_ALIAS           alias of the key in it
#   KEY_PASSWORD        password of that key

on:
  push:
    branches: [Compose2]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two pushes in a row cannot upload over each other.
concurrency:
  group: pre-release
  cancel-in-progress: false

env:
  TAG: prerelease
  APK: vapulla.apk

jobs:
  version:
    name: Check versionCode
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      code: ${{ steps.compare.outputs.code }}
      name: ${{ steps.compare.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare versionCode with the one before the push
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          file=app/build.gradle.kts
          code() { grep -oP 'versionCode\s*=\s*\K\d+' | head -1; }

          new=$(code < "$file")
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$file" | head -1)

          # A new branch has no "before", and neither has a run started by hand.
          old=$(git show "$BEFORE:$file" 2>/dev/null | code || true)
          old=${old:-0}

          if [ "$EVENT" = "workflow_dispatch" ] || [ "$new" -gt "$old" ]; then
            build=true
          else
            build=false
          fi

          echo "versionCode $old -> $new, versionName $name, build: $build"
          {
            echo "build=$build"
            echo "code=$new"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ needs.version.outputs.code }}
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Restores and saves Gradle's downloads and build cache. It saves from the default branch
      # only unless told otherwise, and this workflow never runs there.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Unpack the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set; see the top of this file."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check, test and build
        env:
          VAPULLA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VAPULLA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VAPULLA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VAPULLA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew lintKotlin :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK"

      - name: Publish to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What went in since the build that is published now.
          if previous=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            changes=$(git log --no-merges --format='- %s' "$previous..$GITHUB_SHA" | head -50)
          fi

          {
            echo "Latest build of Vapulla, replaced by every new one."
            echo
            echo "- Version $VERSION_NAME (versionCode $VERSION_CODE)"
            echo "- Commit $GITHUB_SHA"
            echo "- Built $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "This is development software for an unofficial client. Use it at your own risk."
            if [ -n "${changes:-}" ]; then
              echo
              echo "Changes since the build before:"
              echo "$changes"
            fi
          } > notes.md

          # The tag follows the build, so the release always points at what the APK is made of.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          title="Vapulla $VERSION_NAME ($VERSION_CODE)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --title "$title" --notes-file notes.md --prerelease --verify-tag
          fi
          gh release upload "$TAG" "$APK" --clobber
